<svg width="160" height="100" viewBox="0 0 160 100" xmlns="http://www.w3.org/2000/svg">
  <!-- PC Monitor (center) - VERY LARGE -->
  <g>
    <!-- Monitor stand -->
    <rect x="65" y="10" width="30" height="18" fill="#3a3a3a" rx="2"/>
    <!-- Monitor base -->
    <rect x="55" y="28" width="50" height="10" fill="#2a2a2a" rx="1"/>
    <!-- Monitor frame (very large) -->
    <rect x="56" y="-14" width="48" height="32" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="2.5"/>
    <!-- Screen (very large) -->
    <rect x="60" y="-12" width="40" height="28" fill="#4a7aaf"/>
    <!-- Screen glare -->
    <rect x="66" y="-10" width="12" height="8" fill="#7a9acf" opacity="0.7"/>
    <!-- Bezel detail -->
    <rect x="55" y="-15" width="50" height="34" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  </g>

  <!-- Desktop surface (wide and prominent) -->
  <rect x="0" y="42" width="160" height="14" fill="#9b8365" rx="2"/>
  <!-- Desktop detail line -->
  <line x1="0" y1="56" x2="160" y2="56" stroke="#7b6a4f" stroke-width="2.5"/>

  <!-- Left leg -->
  <rect x="8" y="56" width="14" height="44" fill="#6b5345"/>
  <!-- Right leg -->
  <rect x="138" y="56" width="14" height="44" fill="#6b5345"/>

  <!-- Space underneath indicator -->
  <line x1="30" y1="80" x2="130" y2="80" stroke="#7a9aaf" stroke-width="2" opacity="0.6" stroke-dasharray="5,5"/>
</svg>