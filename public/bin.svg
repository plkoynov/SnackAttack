<svg width="40" height="70" viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg">
  <!-- Bin body (cylinder) -->
  <rect x="6" y="18" width="28" height="50" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2" rx="2"/>

  <!-- Bin top rim (circular opening) -->
  <ellipse cx="20" cy="18" rx="14" ry="5" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1.5"/>

  <!-- Bin top highlight -->
  <ellipse cx="20" cy="17" rx="12.5" ry="4" fill="#4a4a4a" opacity="0.4"/>

  <!-- Metal band detail -->
  <rect x="6" y="28" width="28" height="3" fill="#0a0a0a" stroke="#000000" stroke-width="1"/>

  <!-- Vertical ridges -->
  <line x1="12" y1="18" x2="12" y2="68" stroke="#1a1a1a" stroke-width="1.5" opacity="0.6"/>
  <line x1="20" y1="16" x2="20" y2="68" stroke="#1a1a1a" stroke-width="1.5" opacity="0.6"/>
  <line x1="28" y1="18" x2="28" y2="68" stroke="#1a1a1a" stroke-width="1.5" opacity="0.6"/>

  <!-- Bin base -->
  <ellipse cx="20" cy="68" rx="14" ry="4" fill="#0a0a0a" stroke="#000000" stroke-width="1.5"/>

  <!-- Base highlight -->
  <ellipse cx="20" cy="66" rx="12" ry="2.5" fill="#1a1a1a" opacity="0.5"/>
</svg>